name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make test
      - run: ./scripts/secret-scan
      - run: swift build --package-path contacts --configuration release
      - run: swiftc -typecheck scripts/copy-shortcut-actions.swift
      - run: swiftc -typecheck scripts/inspect-shortcuts-clipboard.swift
